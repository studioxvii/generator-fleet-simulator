[metadata]
name = generator-fleet-simulator
version = 1.1.0rc4
description = MIT-licensed Community Edition simulator for standby diesel generator fleets with a dashboard and Modbus TCP interface.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Tom Hammond

[options]
python_requires = >=3.11
py_modules =
    generator
    main
    modbus_server
    runbooks
    scenarios
    wsgi
install_requires =
    flask>=3.0,<4
    flask-socketio>=5.3,<6
    gunicorn>=22,<24
    pymodbus>=3.6,<3.8
    simple-websocket>=1.0,<2

[options.extras_require]
dev =
    pytest>=8.0,<10

[options.entry_points]
console_scripts =
    generator-fleet-sim = main:run

[options.data_files]
share/generator-fleet-simulator/templates = templates/dashboard.html
share/generator-fleet-simulator/static/vendor =
    static/vendor/socket.io.min.js
    static/vendor/socket.io.LICENSE
